title: "Photo Stream demo"
description: "Super simple photo stream, powered by Unsplash & Cecil."
baseurl: https://photo-stream-demo.cecil.app/
language: en
languages:
  - code: en
    name: English
    locale: en_US
author:
  name: Unsplash
  url: https://unsplash.com/s/photos/open-source

photo:
  style:
    color:
      background: black
      text: white
    img:
      height: 300px
      margin: 4px
  sort: asc
  size:
    thumbnail: 640
    full: 1920
    full_widths: [768, 1280] # intermediate widths of the full size photo, loaded according to the screen size
  placeholder: image # image, color or false
  metadata: true # displays photo metadata (EXIF) in the lightbox caption

photoswipe:
  core:
    js: https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js
    css: https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css
  lightbox:
    js: https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.min.js
  caption:
    js: https://cdn.jsdelivr.net/npm/photoswipe-dynamic-caption-plugin@1.2.7/photoswipe-dynamic-caption-plugin.esm.js
    css: https://cdn.jsdelivr.net/npm/photoswipe-dynamic-caption-plugin@1.2.7/photoswipe-dynamic-caption-plugin.css

pages:
  default:
    sitemap:
      published: false
    xsl/sitemap:
      published: false
    xsl/atom:
      published: false
    xsl/rss:
      published: false
output:
  pagetypeformats:
    homepage: [html]
static:
  load: true
metatags:
  data: true
assets:
  images:
    optimize: false
